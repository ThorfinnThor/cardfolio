name: CardTrader API shape probe

# One-off, manually started, read-only. Written to find out the real response shapes before the
# data integration is built. Uploads a small trimmed sample for one day. See docs/cardtrader-release-gate.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardtrader-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Probe blueprint and marketplace response shapes
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: node scripts/cardtrader-sample.mjs --out .cardtrader/sample.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardtrader-sample-${{ github.run_id }}
          path: .cardtrader/sample.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
